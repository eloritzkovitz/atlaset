name: Recalculate visited countries

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  recalculate:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render backend job
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BACKEND_URL}/internal/recalculate-visited-countries"
